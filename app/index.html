<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=1920,height=1080"><title>webOS Home</title><link rel="stylesheet" href="style.css"></head><body>
<div id="wallpaper"></div><div id="shade"></div>
<header><div id="clock"></div><div id="date"></div><div id="weather"></div><small id="weather-credit" class="hidden">Weather data: <a href="https://open-meteo.com/" target="_blank" rel="noopener">Open-Meteo</a></small></header>
<div id="brand">WEBOS <span>HOME</span></div>
<div id="actions"><button data-action="inputs">Inputs</button><button data-action="settings">Settings</button><button data-action="stock">LG Home</button><button data-action="slideshow">Photo slideshow</button></div>
<section id="favourites"><div class="label">YOUR APPS</div><div id="dock" class="row"></div></section>
<div id="all-label" class="label">ALL APPS</div><main id="scroll"><div id="apps"></div></main>
<div id="hint">D-pad to browse · OK to open · Hold Settings for wallpapers</div><div id="focus"></div>
<div id="modal" class="hidden"><div id="panel"><h1 id="modal-title"></h1><div id="modal-items"></div><p id="modal-hint">Back to close</p></div></div>
<div id="saver" class="hidden"><img id="slide-a" alt=""><img id="slide-b" alt=""><div id="saver-clock"></div></div>
<div id="toast" class="hidden"></div>
<script src="config.js"></script><script src="seed.js"></script><script src="home.js"></script></body></html>

<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=1920,height=1080"><title>webOS Home</title><link rel="stylesheet" href="style.css"></head><body>
<div id="wallpaper"></div><div id="shade"></div>
<header><div id="greeting"></div><div id="clock"></div><div id="date"></div><div id="weather"></div><small id="weather-credit" class="hidden">Weather data: <a href="https://open-meteo.com/" target="_blank" rel="noopener">Open-Meteo</a></small></header>
<div id="selection" aria-live="polite"></div>
<div id="actions"><button data-action="inputs"><svg aria-hidden="true" width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M10 4H3v16h7M14 4h7v16h-7M7 12h10m-4-4 4 4-4 4"/></svg><span>Inputs</span></button><button data-action="settings"><svg aria-hidden="true" width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="m9 3-1 3-3 1-2 4 2 2v4l4 3 3-1 3 1 4-3v-4l2-2-2-4-3-1-1-3Z"/><circle cx="12" cy="12" r="3"/></svg><span>Settings</span></button></div>
<section id="favourites"><div id="dock" class="row"></div></section>
<div id="all-label" class="label">ALL APPS</div><main id="scroll"><div id="apps"></div></main>
<div id="browse-hint">↓ All apps</div><div id="focus"></div>
<div id="modal" class="hidden"><div id="panel"><h1 id="modal-title"></h1><div id="modal-items"></div><p id="modal-hint">Back to close</p></div></div>
<div id="saver" class="hidden"><img id="slide-a" alt=""><img id="slide-b" alt=""><div id="saver-clock"></div></div>
<div id="toast" class="hidden"></div>
<script src="config.js"></script><script src="seed.js"></script><script src="home.js"></script></body></html>
